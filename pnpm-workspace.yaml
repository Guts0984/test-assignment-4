packages:
  - apps/*
  - packages/*
  - e2e

# pnpm 12 blocks dependency install scripts unless allowed here.
allowBuilds:
  esbuild: true
  # Optional native speed-up used by bullmq; it works without it.
  msgpackr-extract: false
  # Only prints a donation message.
  "@nestjs/core": false
  # Prisma downloads its migration engine in these install scripts.
  prisma: true
  "@prisma/engines": true
  # Testcontainers dependencies: optional native speed-ups and a version check, not needed.
  cpu-features: false
  protobufjs: false
  ssh2: false
