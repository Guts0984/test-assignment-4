name: CI

on:
  push:
  pull_request:

# Every commit gets a complete run that stays in the history: a newer commit never cancels an older run.
concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # Style rules, type checks and the tests that need no running stack.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # Do all images build, does the whole stack start, and does it behave in a real browser?
  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The one manual step from the README, done here too.
      - run: cp .env.example .env

      - name: Start the stack
        run: docker compose up --build --wait --wait-timeout 300

      - name: Install the browser for the tests
        run: pnpm --filter @app/e2e exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm e2e

      - name: Logs of the stack (on failure)
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down -v
