name: CI

on:
  push:
  pull_request:

# Every commit gets a complete run that stays in the history: a newer commit never cancels an older run.
concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # Style rules, type checks, and the tests. The api, worker and database tests start a real PostgreSQL and a real
  # Redis themselves (Testcontainers, Docker is available on the runner).
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Typecheck works straight after the install: nothing has to be built first.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  # Do all images build, does the whole stack start, and does it behave in real browsers?
  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The one manual step from the README, done here too.
      - run: cp .env.example .env

      # The browser tests (3 runs x 3 browsers) and the load test create many accounts from this one address; the normal
      # limit of 1000 accounts per hour per address would be used up before the load test. Only this CI run is changed.
      - run: echo "REGISTER_MAX_PER_HOUR=20000" >> .env

      - name: Build the images
        run: docker compose build

      - name: Start the stack (migrations and seed run once, by themselves)
        run: docker compose up --wait --wait-timeout 300 -d

      - name: Install the browsers for the tests
        run: pnpm --filter @app/e2e exec playwright install --with-deps chromium firefox webkit

      # Three times in a row on the same stack, without restarting anything in between.
      - name: Browser tests, run 1 of 3
        run: pnpm e2e
      - name: Browser tests, run 2 of 3
        run: pnpm e2e
      - name: Browser tests, run 3 of 3
        run: pnpm e2e

      # Only for the log: how many accounts the browser tests created (the load test needs 200 more).
      - name: Accounts created so far
        run: |
          set -a; . ./.env; set +a
          for key in $(docker compose exec -T redis redis-cli -a "$REDIS_PASSWORD" --no-auth-warning --scan --pattern 'rl:register*'); do
            echo "$key = $(docker compose exec -T redis redis-cli -a "$REDIS_PASSWORD" --no-auth-warning get "$key")"
          done

      - name: Load test (200 buyers, 10 seats)
        run: pnpm --filter @app/loadtest loadtest

      - name: Logs of the stack (on failure)
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down -v
