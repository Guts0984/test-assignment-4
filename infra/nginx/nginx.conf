# The only door into the stack. Everything else stays on the private Docker network.

# One worker is enough here, and it shares requests evenly between the two api instances
# (several workers would each keep their own count and start unevenly).
worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # One JSON object per line, with the request id that is passed on to the api and the web app.
    log_format json escape=json
        '{"time":"$time_iso8601","service":"nginx","requestId":"$request_id",'
        '"remoteAddr":"$remote_addr","method":"$request_method","uri":"$request_uri",'
        '"status":$status,"bytes":$body_bytes_sent,"durationSeconds":$request_time,'
        '"cache":"$upstream_cache_status","upstream":"$upstream_addr"}';
    access_log /dev/stdout json;
    error_log /dev/stderr warn;

    # Both api instances; requests are shared between them in turn.
    # Docker's own name server. The names below are looked up again every few seconds, so an api or web
    # container that is replaced (new address) keeps working without restarting nginx.
    # (A fixed "upstream" block would look the names up once, at start, and answer 502 after a replacement.)
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    # "api" is shared by both api instances, so each lookup returns both addresses and nginx alternates between them;
    # if one does not answer, the other is tried (proxy_next_upstream, on by default for connection errors).
    map $host $api_upstream { default api:4000; }
    map $http_upgrade $connection_upgrade { default upgrade; "" close; }
    map $host $web_upstream { default web:3000; }

    # Where saved copies of public pages are kept. A copy is forgotten after 5 seconds.
    # Page requests per visitor address. Pages cause work in the web app and the database (a search for a text nobody
    # asked for before, an event number nobody asked for before), and those calls carry no visitor address of their
    # own, so the api's limiter cannot see them. 20 a second, with room for a burst of 40 (a page and its small requests).
    limit_req_zone $page_limit_key zone=pages_per_ip:10m rate=20r/s;
    # The browser also asks for the data of every link it can see (Next.js "prefetch", header RSC) so the next click is
    # instant; a list of events does dozens of these at once. They have a limit of their own, higher but still a limit.
    limit_req_zone $rsc_limit_key zone=rsc_per_ip:10m rate=100r/s;
    map $http_rsc $page_limit_key { default ""; "" $binary_remote_addr; }
    map $http_rsc $rsc_limit_key { default $binary_remote_addr; "" ""; }
    limit_req_status 429;

    proxy_cache_path /tmp/nginx-pages levels=1:2 keys_zone=pages:5m max_size=64m inactive=30s use_temp_path=off;

    server {
        listen 8080;

        # Redirect with a path only (/api/docs/). Otherwise nginx writes its own port (8080)
        # into the address, which is wrong when the stack is published on another port.
        absolute_redirect off;

        # A request body that is too large is refused by nginx itself, before the api sees it. It is answered in the api's error
        # shape ({ "code", "message" }) so every client sees one format.
        # Not covered on purpose: errors nginx gives up on before it has parsed the request (an address or header block that is too
        # long, a "%00" in the address). A custom error page there makes nginx answer 500; its own plain page is still a 4xx.
        error_page 413 @error_413;
        location @error_413 {
            default_type application/json;
            return 413 '{"code":"PAYLOAD_TOO_LARGE","message":"The request is too large."}';
        }

        # For Docker's health check.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # The web app's refresh endpoint is for our own worker, which calls it inside the Docker network.
        # From outside it does not exist.
        location /internal/ {
            return 404;
        }

        # The assignment says the API docs are at /docs: serve them there as well as under /api.
        location = /docs {
            return 301 /docs/;
        }
        location /docs/ {
            include snippets/proxy-api.conf;
            proxy_pass http://$api_upstream;
        }
        location = /openapi.json {
            include snippets/proxy-api.conf;
            proxy_pass http://$api_upstream;
        }

        # The docs page needs the trailing slash; add it here, keeping the /api prefix.
        location = /api/docs {
            return 301 /api/docs/;
        }

        # Live seat updates (Socket.IO over WebSocket): the connection stays open for a long time, nothing may be buffered,
        # and the "upgrade" request has to be passed on. The api answers; any of the two instances will do (WebSocket only,
        # so no sticky routing is needed: the Redis adapter carries messages between the instances).
        location /socket.io/ {
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Request-Id $request_id;
            # Replace whatever the browser sent, never append to it.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Only our own web server may claim to speak for a visitor (and the api checks a signature as well).
            proxy_set_header X-End-User-IP "";
            proxy_set_header X-Internal-Timestamp "";
            proxy_set_header X-Internal-Signature "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass http://$api_upstream;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        # /api/health -> api /health  (the rewrite below removes the /api prefix)
        location /api/ {
            # With a variable, proxy_pass cannot cut the prefix by itself, so it is cut here.
            rewrite ^/api/(.*)$ /$1 break;
            include snippets/proxy-api.conf;
            proxy_pass http://$api_upstream;
        }

        # Pages that belong to one visitor, or change who they are: never saved.
        # Built files: always the same, cached by the browser, not part of the page limit.
        location /_next/ {
            include snippets/proxy-web.conf;
            proxy_pass http://$web_upstream;
        }

        location ~ ^/(me|checkout|admin|login|register)(/|$) {
            limit_req zone=pages_per_ip burst=40 nodelay;
            limit_req zone=rsc_per_ip burst=200 nodelay;
            include snippets/proxy-web.conf;
            proxy_pass http://$web_upstream;
            add_header X-Cache-Status "BYPASS" always;
        }

        # Everything else is the public site: the catalog and the event pages.
        # For visitors who are not logged in, a copy is kept for 4 seconds (nginx counts whole seconds, so it lives 4 to 5 s: never longer than the 5 s an edit may take to show).
        location / {
            limit_req zone=pages_per_ip burst=40 nodelay;
            limit_req zone=rsc_per_ip burst=200 nodelay;
            include snippets/proxy-web.conf;
            proxy_pass http://$web_upstream;

            proxy_cache pages;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            proxy_cache_methods GET HEAD;
            proxy_cache_valid 200 4s;
            # Our own rule decides how long, whatever the web app suggests.
            proxy_ignore_headers Cache-Control Expires;
            # A logged-in visitor (session cookie) is never given a saved copy and never leaves one behind.
            # The same for requests that are not plain page loads (Next.js data requests, form actions).
            proxy_cache_bypass $cookie_sid $http_rsc $http_next_action $http_next_router_prefetch;
            proxy_no_cache $cookie_sid $http_rsc $http_next_action $upstream_http_set_cookie;
            # Many visitors asking for the same page at once cause one request to the web app.
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_buffering on;

            # HIT, MISS, EXPIRED, BYPASS ...
            add_header X-Cache-Status $upstream_cache_status always;
        }
    }
}
