# Headers every request to the api gets. Shared by the normal api location and the live stream.

proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header Host $http_host;
proxy_set_header X-Request-Id $request_id;
# Replace whatever the browser sent, never append to it.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

# These headers prove "this call comes from our own web server". A browser must never be able to send
# them, so they are removed here (and the api checks a signature as well, as a second lock).
proxy_set_header X-End-User-IP "";
proxy_set_header X-Internal-Timestamp "";
proxy_set_header X-Internal-Signature "";
